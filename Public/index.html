<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>₿ BTC 預測指數</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020617;--card:#0f172a;--card2:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--bull:#22c55e;--bear:#ef4444;--neutral:#f59e0b;--accent:#6366f1;--accent2:#8b5cf6;--mono:'JetBrains Mono',monospace;--sans:'Noto Sans TC',sans-serif}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--card) 30%,var(--bg) 100%);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
.header{background:linear-gradient(135deg,var(--card) 0%,#1e1b4b 50%,var(--card) 100%);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.header h1{font-size:17px;font-weight:900;font-family:var(--mono);background:linear-gradient(135deg,var(--accent),var(--accent2),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.header .sub{font-size:11px;color:var(--dim);margin-top:2px}
.btn{font-family:var(--mono);font-size:11px;border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid;transition:all 0.2s}
.btn-refresh{background:rgba(99,102,241,0.1);border-color:var(--accent);color:#a5b4fc}
.btn-auto{border-color:var(--bull);color:var(--bull);background:rgba(34,197,94,0.1)}
.btn-auto.off{border-color:var(--dim);color:var(--dim);background:rgba(100,116,139,0.1)}
.meta{font-size:10px;color:#475569;margin-top:4px}
.container{max-width:800px;margin:0 auto;padding:16px}
.gauge-card{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;text-align:center}
.signal-label{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:2px;margin-top:-8px}
.signal-meta{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.action-box{padding:12px 20px;border-radius:8px;margin-top:14px;text-align:center}
.action-text{font-size:16px;font-weight:700}
.action-sub{font-size:11px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--card2);border-radius:12px;padding:12px;text-align:center}
.stat-label{font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:1px}
.stat-value{font-size:22px;font-weight:800;font-family:var(--mono);margin-top:4px}
.stat-sub{font-size:10px;color:var(--muted);margin-top:2px}
.dist-card{background:var(--card);border:1px solid var(--card2);border-radius:12px;padding:16px;margin-bottom:16px}
.dist-title{color:var(--text);font-size:13px;font-weight:700;font-family:var(--mono);letter-spacing:1px;margin-bottom:12px}
.dist-bars{display:flex;align-items:flex-end;gap:4px;height:110px}
.dist-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dist-pct{font-size:9px;font-family:var(--mono);margin-bottom:3px}
.dist-bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height 0.5s}
.dist-range{font-size:8px;color:var(--dim);font-family:var(--mono);margin-top:3px;text-align:center;line-height:1.2}
.strategy-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--card2);border-radius:8px;margin-bottom:8px}
.strat-name{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.strat-desc{font-size:11px;color:var(--muted);margin-top:2px}
.strat-risk{font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 8px;border-radius:4px}
.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.filter-btn{font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;border:1px solid var(--border);background:var(--card2);color:var(--muted);transition:all 0.2s}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.market-card{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;transition:border-color 0.2s}
.market-row{display:flex;justify-content:space-between;align-items:flex-start}
.market-tags{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff}
.tag-updown{background:var(--accent)}.tag-range{background:var(--accent2)}.tag-above_below{background:#06b6d4}
.tag-tf{background:transparent;border:1px solid #475569;color:var(--muted)}
.market-q{font-size:13px;color:var(--text);line-height:1.4;font-family:var(--mono)}
.market-price{font-size:22px;font-weight:800;font-family:var(--mono)}
.market-vol{font-size:11px;color:var(--dim);margin-top:2px}
.prob-bar{margin-top:8px;height:4px;background:var(--card2);border-radius:2px;overflow:hidden}
.prob-fill{height:100%;border-radius:2px;transition:width 0.5s}
.method{background:var(--card);border:1px solid var(--card2);border-radius:12px;padding:16px;margin-top:20px}
.method h3{color:var(--muted);font-size:13px;font-weight:700;font-family:var(--mono);margin-bottom:10px}
.method p{font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:6px}
.method strong{color:#a5b4fc}.method .warn{color:var(--bear)}
.history-card{background:var(--card);border:1px solid var(--card2);border-radius:12px;padding:16px;margin-bottom:16px}
.history-chart{height:80px;display:flex;align-items:center;gap:1px}
.history-bar{flex:1;border-radius:2px;min-width:2px;transition:height 0.3s}
.loading{text-align:center;padding:60px 20px;color:var(--dim);font-size:14px}
@media(max-width:480px){.header h1{font-size:15px}.stat-value{font-size:18px}.signal-label{font-size:22px}}
</style>
</head>
<body>
<div class="header">
<div class="header-top">
<div><h1>₿ POLYMARKET × BTC</h1><div class="sub">基於 Polymarket 下注機率即時運算交易信號</div></div>
<div style="display:flex;gap:6px">
<button class="btn btn-auto" id="autoBtn" onclick="toggleAuto()">● 自動</button>
<button class="btn btn-refresh" id="refreshBtn" onclick="doRefresh()">⟳ 刷新</button>
</div></div>
<div ​​​​​​​​​​<div class="meta" id="metaInfo">載入中...</div>
</div>
<div class="container" id="app"><div class="loading">⟳ 正在連接 Polymarket...</div></div>
<script>
let autoOn=true,intv=null,curFilter='all',D={signal:null,markets:[],history:[]};
const $=s=>document.querySelector(s),pct=v=>(v*100).toFixed(1)+'%',usd=v=>'$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:0});

async function fetchAll(){
try{
const[s,m,h]=await Promise.all([fetch('/api/signal'),fetch('/api/markets'),fetch('/api/history?limit=60')]);
const sd=await s.json(),md=await m.json(),hd=await h.json();
D.signal=sd.signal;D.markets=md.markets||[];D.history=hd.history||[];D.lastUpdate=sd.lastUpdate;
render();
$('#metaInfo').textContent=`更新: ${new Date(sd.lastUpdate).toLocaleTimeString('zh-TW')} ｜ Polymarket Gamma API`;
}catch(e){$('#metaInfo').textContent='⚠ '+e.message}}

async function doRefresh(){$('#refreshBtn').textContent='⟳ ...';try{await fetch('/api/refresh',{method:'POST'});await fetchAll()}finally{$('#refreshBtn').textContent='⟳ 刷新'}}

function toggleAuto(){autoOn=!autoOn;const b=$('#autoBtn');b.textContent=autoOn?'● 自動':'○ 暫停';b.className='btn btn-auto'+(autoOn?'':' off');autoOn?intv=setInterval(fetchAll,30000):clearInterval(intv)}

function render(){
const{signal:sig,markets,history}=D;
if(!sig){$('#app').innerHTML='<div class="loading">⏳ 等待數據...</div>';return}
const sc=sig.composite>0.15?'var(--bull)':sig.composite<-0.15?'var(--bear)':'var(--neutral)',ang=sig.composite*90;
let h='';
h+=`<div class="gauge-card" style="box-shadow:0 0 40px ${sc}10">
<svg width="260" height="150" viewBox="0 0 280 160" style="display:block;margin:0 auto">
<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--bear)"/><stop offset="35%" stop-color="var(--neutral)"/><stop offset="65%" stop-color="var(--neutral)"/><stop offset="100%" stop-color="var(--bull)"/></linearGradient></defs>
<path d="M 30 140 A 110 110 0 0 1 250 140" fill="none" stroke="var(--card2)" stroke-width="20" stroke-linecap="round"/>
<path d="M 30 140 A 110 110 0 0 1 250 140" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
<g transform="rotate(${ang},140,140)"><line x1="140" y1="140" x2="140" y2="48" stroke="${sc}" stroke-width="3" stroke-linecap="round"/><circle cx="140" cy="140" r="8" fill="${sc}"/><circle cx="140" cy="140" r="4" fill="var(--bg)"/></g>
<text x="20" y="155" fill="var(--bear)" font-size="11" font-family="var(--mono)">BEAR</text>
<text x="230" y="155" fill="var(--bull)" font-size="11" font-family="var(--mono)">BULL</text></svg>
<div class="signal-label" style="color:${sc}">${sig.label}</div>
<div class="signal-meta">分數: ${(sig.composite*100).toFixed(1)} ｜強度: ${(sig.strength*100).toFixed(0)}%</div>
<div class="action-box" style="background:${sc}10;border:1px solid ${sc}30">
<div class="action-text" style="color:${sc}">${sig.action}</div>
<div class="action-sub">${sig.marketCount} 個市場 ｜ ${usd(sig.totalVolume)}</div></div></div>`;
const bc=sig.dirBias>0?'var(--bull)':sig.dirBias<0?'var(--bear)':'var(--neutral)';
h+=`<div class="stats">
<div class="stat-card"><div class="stat-label">方向偏差</div><div class="stat-value" style="color:${bc}">${sig.dirBias>0?'+':''}${(sig.dirBias*100).toFixed(1)}</div><div class="stat-sub">${sig.dirBias>0?'偏多':sig.dirBias<0?'偏空':'平衡'}</div></div>
<div class="stat-card"><div class="stat-label">活躍市場</div><div class="stat-value" style="color:var(--accent)">${sig.marketCount}</div><div class="stat-sub">漲${sig.upDownCount} 區${sig.rangeCount} 突${sig.abCount}</div></div>
<div class="stat-card"><div class="stat-label">信號強度</div><div class="stat-value" style="color:${sig.strength>0.5?'var(--bull)':'var(--neutral)'}">${(sig.strength*100).toFixed(0)}%</div><div class="stat-sub">${sig.strength>0.5?'高度可信':'參考用'}</div></div></div>`;
if(history.length>1){
const hb=history.map(x=>{const c=x.composite,co=c>0.15?'var(--bull)':c<-0.15?'var(--bear)':'var(--neutral)';return`<div class="history-bar" style="height:${Math.max(Math.abs(c)*100,4)}%;background:${co};align-self:${c>=0?'flex-end':'flex-start'}"></div>`}).join('');
h+=`<div class="history-card"><div class="dist-title">信號趨勢 (${history.length}筆)</div><div class="history-chart">${hb}</div></div>`}
const rng=markets.filter(m=>m.type==='range').sort((a,b)=>(a.rangeLow||0)-(b.rangeLow||0));
if(rng.length>0){const mx=Math.max(...rng.map(r=>r.yesPrice),0.01);
let rb='';rng.forEach(r=>{const hp=(r.yesPrice/mx)*100,im=r.yesPrice===mx,co=im?'linear-gradient(180deg,var(--bull),#16a34a)':'linear-gradient(180deg,var(--accent),#4f46e5)',sh=im?'box-shadow:0 0 12px rgba(34,197,94,0.3);':'';
rb+=`<div class="dist-col"><div class="dist-pct" style="color:${im?'var(--bull)':'var(--muted)'};font-weight:${im?700:400}">${pct(r.yesPrice)}</div><div class="dist-bar" style="height:${hp}%;background:${co};${sh}"></div><div class="dist-range">${r.rangeLow?(r.rangeLow/1000).toFixed(0):'?'}k-${r.rangeHigh?(r.rangeHigh/1000).toFixed(0):'?'}k</div></div>`});
h+=`<div class="dist-card"><div class="dist-title">價格區間機率分佈</div><div class="dist-bars">${rb}</div></div>`}
const c=sig.composite;let st=[];
if(c>0.3){st.push({n:'積極做多',d:'多方機率偏高',r:'低',rc:'var(--bull)'});st.push({n:'買看漲期權',d:'槓桿放大',r:'中',rc:'var(--neutral)'})}
else if(c>0.15){st.push({n:'輕倉做多',d:'溫和偏多',r:'低',rc:'var(--bull)'})}
else if(c<-0.3){st.push({n:'積極做空',d:'空方佔優',r:'中',rc:'var(--neutral)'});st.push({n:'減持現貨',d:'降低敞口',r:'低',rc:'var(--bull)'})}
else if(c<-0.15){st.push({n:'輕倉做空',d:'溫和偏空',r:'低',rc:'var(--bull)'})}
else{st.push({n:'區間操作',d:'高拋低吸',r:'低',rc:'var(--bull)'});st.push({n:'觀望等待',d:'等方向明朗',r:'無',rc:'var(--dim)'})}
if(sig.topRange){st.push({n:`目標 $${(sig.topRange.low/1000).toFixed(0)}k-$${(sig.topRange.high/1000).toFixed(0)}k`,d:`最高機率 (${pct(sig.topRange.prob)})`,r:'參考',rc:'var(--accent2)'})}
h+=`<div class="dist-card"><div class="dist-title">建議策略</div>${st.map(s=>`<div class="strategy-item"><div><div class="strat-name">${s.n}</div><div class="strat-desc">${s.d}</div></div><span class="strat-risk" style="color:${s.rc};border:1px solid ${s.rc}40">風險:${s.r}</span></div>`).join('')}</div>`;
const cn={all:markets.length,updown:0,range:0,above_below:0},lb={all:'全部',updown:'漲跌',range:'區間',above_below:'突破'};
markets.forEach(m=>{if(cn[m.type]!==undefined)cn[m.type]++});
h+='<div class="filters">';for(const k of['all','updown','range','above_below']){h+=`<button class="filter-btn${curFilter===k?' active':''}" onclick="setF('${k}')">${lb[k]}(${cn[k]})</button>`}h+='</div>';
const fl=curFilter==='all'?markets:markets.filter(m=>m.type===curFilter);
[...fl].sort((a,b)=>b.volume-a.volume).forEach(m=>{
const pc=m.yesPrice>=0.5?'var(--bull)':'var(--bear)',tf=m.timeframe?`<span class="tag tag-tf">${m.timeframe}</span>`:'';
h+=`<div class="market-card"><div class="market-row"><div style="flex:1"><div class="market-tags"><span class="tag tag-${m.type}">${lb[m.type]||m.type}</span>${tf}</div><div class="market-q">${m.question}</div></div><div style="text-align:right;min-width:90px"><div class="market-price" style="color:${pc}">${pct(m.yesPrice)}</div><div class="market-vol">Vol:${usd(m.volume)}</div></div></div><div class="prob-bar"><div class="prob-fill" style="width:${pct(m.yesPrice)};background:${pc}"></div></div></div>`});
if(fl.length===0)h+='<div class="loading">無符合條件的市場</div>';
h+=`<div class="method"><h3>系統方法論</h3>
<p><strong>數據源：</strong>Polymarket Gamma API 每5分鐘更新</p>
<p><strong>信號：</strong>方向偏差 + 區間分佈 + 突破機率 三維運算</p>
<p><strong>權重：</strong>交易量 log10 加權</p>
<p><strong class="warn">風險提示：</strong>僅供參考，不構成投資建議</p></div>`;
$('#app').innerHTML=h}
function setF(f){curFilter=f;render()}
fetchAll();intv=setInterval(fetchAll,30000);
</script>
</body>
</html>
